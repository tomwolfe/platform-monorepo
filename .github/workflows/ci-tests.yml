name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # SCHEMA VALIDATION
  # Validates MCP tool definitions match database schemas before running tests
  # ============================================================================
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SECURITY: Harden the GitHub Actions runner
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SECURITY: Audit dependencies for known vulnerabilities
      - name: Security Audit - Dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Validate schema sync
        run: pnpm validate:schema-sync:strict
        continue-on-error: true
        id: schema-check

      - name: Upload schema sync report
        uses: actions/upload-artifact@v4
        if: always() && steps.schema-check.outcome != 'success'
        with:
          name: schema-sync-report
          path: |
            schema-sync-report.json
            **/schema-sync-report.json
          retention-days: 30

      - name: Fail on schema validation error
        if: steps.schema-check.outcome != 'success'
        run: |
          echo "❌ Schema validation failed. MCP tool definitions may be out of sync with database schemas."
          echo "Please run 'pnpm validate:schema-sync:strict' locally to see the issues."
          exit 1

  # ============================================================================
  # LINT & TYPE CHECK
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [schema-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint
        continue-on-error: true

      - name: Run type check
        run: pnpm db:generate
        continue-on-error: true

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apps
          POSTGRES_PASSWORD: apps
          POSTGRES_DB: apps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp .env.local.example .env.local
          cat >> .env.local << EOF
          DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL=redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN=test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_test_key
          CLERK_SECRET_KEY=sk_test_ci_test_secret
          INTERNAL_SYSTEM_KEY=test-key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999
          LLM_MODEL=test-model
          RESEND_API_KEY=re_test_ci_key
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ABLY_API_KEY=local:appkey
          ABLY_REST_HOST=localhost
          ABLY_REALTIME_HOST=localhost
          ABLY_REST_PORT=5000
          ABLY_REALTIME_PORT=5000
          ABLY_TLS=false
          BASE_RPC_URL=https://mainnet.base.org
          NEXT_PUBLIC_TREASURY_WALLET_ADDRESS=0x1234567890123456789012345678901234567890
          NEXT_PUBLIC_MIN_CONFIRMATIONS=3
          EOF

      - name: Generate database schema
        run: pnpm db:generate

      - name: Run unit tests with coverage
        run: pnpm test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL: redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/**/*
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            *.log
          retention-days: 7

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apps
          POSTGRES_PASSWORD: apps
          POSTGRES_DB: apps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp .env.local.example .env.local
          cat >> .env.local << EOF
          DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL=redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN=test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_test_key
          CLERK_SECRET_KEY=sk_test_ci_test_secret
          INTERNAL_SYSTEM_KEY=test-key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999
          LLM_MODEL=test-model
          RESEND_API_KEY=re_test_ci_key
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ABLY_API_KEY=local:appkey
          ABLY_REST_HOST=localhost
          ABLY_REALTIME_HOST=localhost
          ABLY_REST_PORT=5000
          ABLY_REALTIME_PORT=5000
          ABLY_TLS=false
          BASE_RPC_URL=https://mainnet.base.org
          NEXT_PUBLIC_TREASURY_WALLET_ADDRESS=0x1234567890123456789012345678901234567890
          NEXT_PUBLIC_MIN_CONFIRMATIONS=3
          EOF

      - name: Generate database schema
        run: pnpm db:generate

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL: redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            *.log
          retention-days: 7

  # ============================================================================
  # CHAOS TESTS
  # ============================================================================
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apps
          POSTGRES_PASSWORD: apps
          POSTGRES_DB: apps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp .env.local.example .env.local
          cat >> .env.local << EOF
          DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL=redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN=test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_test_key
          CLERK_SECRET_KEY=sk_test_ci_test_secret
          INTERNAL_SYSTEM_KEY=test-key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999
          LLM_MODEL=test-model
          RESEND_API_KEY=re_test_ci_key
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ABLY_API_KEY=local:appkey
          ABLY_REST_HOST=localhost
          ABLY_REALTIME_HOST=localhost
          ABLY_REST_PORT=5000
          ABLY_REALTIME_PORT=5000
          ABLY_TLS=false
          EOF

      - name: Generate database schema
        run: pnpm db:generate

      - name: Run chaos tests
        run: pnpm test:chaos
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL: redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-test-results
          path: |
            *.log
          retention-days: 7

  # ============================================================================
  # COVERAGE CHECK
  # ============================================================================
  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apps
          POSTGRES_PASSWORD: apps
          POSTGRES_DB: apps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp .env.local.example .env.local
          cat >> .env.local << EOF
          DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL=redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN=test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_test_key
          CLERK_SECRET_KEY=sk_test_ci_test_secret
          INTERNAL_SYSTEM_KEY=test-key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999
          LLM_MODEL=test-model
          RESEND_API_KEY=re_test_ci_key
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ABLY_API_KEY=local:appkey
          ABLY_REST_HOST=localhost
          ABLY_REALTIME_HOST=localhost
          ABLY_REST_PORT=5000
          ABLY_REALTIME_PORT=5000
          ABLY_TLS=false
          EOF

      - name: Generate database schema
        run: pnpm db:generate

      - name: Run tests with coverage thresholds
        run: pnpm test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL: postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL: redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: test

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # Coverage thresholds are enforced by vitest.config.ts
          # This step ensures the build fails if coverage is below threshold
          cat coverage/coverage-summary.json | jq '.total.lines.pct' > coverage-lines.txt
          COVERAGE=$(cat coverage-lines.txt)
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE%) is below 70% threshold"
            exit 1
          fi
          echo "✅ Coverage ($COVERAGE%) meets 70% threshold"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          retention-days: 30

  # ============================================================================
  # BUILD VERIFICATION
  # ============================================================================
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Verify build artifacts
        run: |
          echo "Verifying build artifacts..."
          test -d apps/table-stack/.next || exit 1
          test -d apps/intention-engine/.next || exit 1
          echo "✅ Build artifacts verified"

  # ============================================================================
  # VALIDATE ENVIRONMENT
  # ============================================================================
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment files
        run: pnpm validate:env

      - name: Validate schema sync
        run: pnpm validate:schema-sync

  # ============================================================================
  # CHECK DATABASE MIGRATIONS
  # ============================================================================
  check-migrations:
    name: Check Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apps
          POSTGRES_PASSWORD: apps
          POSTGRES_DB: apps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp .env.local.example .env.local
          cat >> .env.local << EOF
          DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          EOF

      - name: Generate migrations
        run: pnpm db:generate

      - name: Check for uncommitted migration files
        run: |
          echo "Checking for uncommitted migration files..."
          MIGRATION_FILES=$(git status --porcelain -- packages/database/src/drizzle/migrations/*.sql 2>/dev/null | wc -l)
          if [ "$MIGRATION_FILES" -gt 0 ]; then
            echo "❌ Found $MIGRATION_FILES uncommitted migration file(s):"
            git status --porcelain -- packages/database/src/drizzle/migrations/*.sql
            echo ""
            echo "Please commit these migration files before merging."
            exit 1
          fi
          echo "✅ No uncommitted migration files found"

      - name: Validate migration safety
        run: |
          echo "Validating migration safety..."
          # Check for dangerous operations in recent migrations
          LATEST_MIGRATION=$(ls -t packages/database/src/drizzle/migrations/*.sql 2>/dev/null | head -1)
          if [ -n "$LATEST_MIGRATION" ]; then
            echo "Latest migration file: $LATEST_MIGRATION"
            if grep -qi "DROP TABLE\|DROP COLUMN" "$LATEST_MIGRATION"; then
              echo "⚠️  WARNING: Latest migration contains DROP operation"
              echo "Please ensure this is a backward-compatible change or has been reviewed manually"
              # Don't fail the build, but warn
            else
              echo "✅ Latest migration appears safe (no DROP operations)"
            fi
          else
            echo "ℹ️  No migration files found"
          fi

  # ============================================================================
  # E2E TESTS
  # Tests critical user journeys with Playwright
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Setup environment
        run: |
          cp .env.local.example .env.local
          cat >> .env.local << EOF
          DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          TEST_DATABASE_URL=postgresql://apps:apps@localhost:5432/apps_test
          UPSTASH_REDIS_REST_URL=redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN=test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_test_key
          CLERK_SECRET_KEY=sk_test_ci_test_secret
          INTERNAL_SYSTEM_KEY=test-key
          LLM_API_KEY=test_llm_key
          LLM_BASE_URL=http://localhost:9999
          LLM_MODEL=test-model
          RESEND_API_KEY=re_test_ci_key
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ABLY_API_KEY=local:appkey
          ABLY_REST_HOST=localhost
          ABLY_REALTIME_HOST=localhost
          ABLY_REST_PORT=5000
          ABLY_REALTIME_PORT=5000
          ABLY_TLS=false
          EOF

      - name: Generate database schema
        run: pnpm db:generate

      - name: Build application
        run: pnpm build --filter=@repo/table-stack

      - name: Start application and run E2E tests
        run: |
          # Start the app in background
          pnpm start --filter=@repo/table-stack &
          APP_PID=$!

          # Wait for app to be ready
          npx wait-on http://localhost:3000 --timeout 60000

          # Run E2E tests
          pnpm exec playwright test
          TEST_EXIT_CODE=$?

          # Clean up
          kill $APP_PID

          exit $TEST_EXIT_CODE

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-results/
            playwright-report/
          retention-days: 30

  # ============================================================================
  # SUMMARY
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - schema-validation
      - lint-and-typecheck
      - unit-tests
      - integration-tests
      - chaos-tests
      - coverage-check
      - build-verification
      - validate-environment
      - check-migrations
      - e2e-tests
    if: always()

    steps:
      - name: Check CI status
        run: |
          echo "=== CI Test Summary ==="
          echo "Schema Validation: ${{ needs.schema-validation.result }}"
          echo "Lint & Typecheck: ${{ needs.lint-and-typecheck.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Chaos Tests: ${{ needs.chaos-tests.result }}"
          echo "Coverage Check: ${{ needs.coverage-check.result }}"
          echo "Build Verification: ${{ needs.build-verification.result }}"
          echo "Validate Environment: ${{ needs.validate-environment.result }}"
          echo "Check Migrations: ${{ needs.check-migrations.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          # Fail if any critical jobs failed
          if [[ "${{ needs.schema-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.coverage-check.result }}" == "failure" ]] || \
             [[ "${{ needs.build-verification.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "❌ CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
