services:
  # Deterministic Anvil instance for CI Web3 testing
  # Uses Foundry's anvil with fixed chain ID and account configuration
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: monorepo-anvil
    entrypoint: anvil
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
