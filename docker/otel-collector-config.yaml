receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Add service name and environment for better correlation
  resource:
    attributes:
      - key: service.name
        value: "apps-monorepo"
        action: upsert
      - key: deployment.environment
        value: "development"
        action: upsert

  # Extract trace ID for log correlation
  transform:
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["trace_id"], TraceId()) where TraceId() != ""
          - set(resource.attributes["span_id"], SpanId()) where SpanId() != ""

exporters:
  debug:
    verbosity: detailed

  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      level: true
      service: true
    labels:
      attributes:
        - trace_id
        - executionId
        - span_id
        - service.name
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/tempo, debug]
    
    logs:
      receivers: [otlp]
      processors: [batch, resource, transform]
      exporters: [loki, debug]
